<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Tasas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#0e2340; --ink2:#46566e; --ink3:#8793a6;
  --line:#e3e8ef; --accent:#1d61aa; --accent-soft:#e6f0fb;
  --good:#12803a; --good-bg:#e4f6ea; --good-line:#a9e0bc;
  --bad:#c2301f; --bad-bg:#fdeae7; --bad-line:#f3b4ab;
  --warn:#a45a06; --warn-bg:#fdf1dc; --warn-line:#f0cf8f;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1424; --card:#12203a; --ink:#eef3fb; --ink2:#a9b7cc; --ink3:#6f7f98;
    --line:#223454; --accent:#6aaef0; --accent-soft:#16304f;
    --good:#4cd07d; --good-bg:#10321f; --good-line:#1f6a3d;
    --bad:#ff8a7a; --bad-bg:#3a1713; --bad-line:#7a2e25;
    --warn:#f2b95a; --warn-bg:#35260b; --warn-line:#7a5614;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.title{font-size:1.35rem;font-weight:700;letter-spacing:-.03em}
.title small{display:block;font-size:.72rem;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:1px}
.refresh{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 12px;font-size:.82rem;font-weight:600;color:var(--accent);min-height:44px}
.refresh svg{width:18px;height:18px;transition:transform .6s}
.refresh.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* rates strip */
.rates{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rates::-webkit-scrollbar{display:none}
.rate{flex:0 0 auto;min-width:96px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.rate .k{font-size:.66rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.rate .v{font-family:var(--mono);font-size:1.02rem;font-weight:500;margin-top:1px}
.rate.empty{border-style:dashed;border-color:var(--warn-line);background:var(--warn-bg)}
.rate.empty .v{color:var(--warn)}
.rate.gap .v{color:var(--accent)}
.stamp{font-size:.72rem;color:var(--ink3);margin:2px 2px 14px;display:flex;justify-content:space-between}
.stamp button{color:var(--accent);font-weight:600;font-size:.72rem;padding:4px 0}

.gap{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:12px;padding:9px 14px;font-size:.8rem;font-weight:500;color:var(--ink2);margin:0 0 4px}
.gap[hidden]{display:none}
.gap b{font-family:var(--mono);font-size:.95rem;font-weight:500;color:var(--accent)}

/* anchor */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{padding:10px 2px;border-radius:11px;font-size:.76rem;font-weight:600;color:var(--ink2);line-height:1.15;min-height:48px}
.seg button small{display:block;font-size:.64rem;font-weight:500;color:var(--ink3);margin-top:2px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(14,35,64,.14)}
.amount{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px}
.amount label{font-size:.76rem;font-weight:600;color:var(--ink3)}
.field{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.field .u{font-size:1.5rem;font-weight:600;color:var(--ink3);font-family:var(--mono)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--mono);font-size:2.5rem;font-weight:500;color:var(--ink);letter-spacing:-.03em;padding:2px 0}
.field input::placeholder{color:var(--line)}
.clear{width:36px;height:36px;border-radius:50%;background:var(--line);color:var(--ink2);font-size:1rem;display:none;align-self:center}
.clear.show{display:block}
.quick{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-family:var(--mono);font-size:.85rem;color:var(--ink2);min-height:40px}
.quick button:active{background:var(--accent-soft)}

/* result */
.res{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{border-radius:var(--r);padding:16px 18px;border:1px solid}
.verdict.good{background:var(--good-bg);border-color:var(--good-line)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.verdict.neutral{background:var(--card);border-color:var(--line)}
.verdict .vk{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.75}
.verdict.good .vk,.verdict.good .vh{color:var(--good)}
.verdict.bad .vk,.verdict.bad .vh{color:var(--bad)}
.verdict.warn .vk,.verdict.warn .vh{color:var(--warn)}
.verdict.slim{padding:11px 16px;border-radius:14px}
.verdict.slim .vs{margin:0;font-size:.9rem;font-weight:500}
.verdict.slim.good .vs{color:var(--good)}.verdict.slim.bad .vs{color:var(--bad)}.verdict.slim.warn .vs{color:var(--warn)}
.vh{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:3px}
.vs{font-size:.88rem;color:var(--ink2);margin-top:6px}
.vs b{font-family:var(--mono);color:var(--ink);font-weight:500}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.route{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;position:relative}
.route.win{border-color:var(--good);}
.route .rn{font-size:.72rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;line-height:1.25}
.route .rl{font-size:.74rem;color:var(--ink3);margin-top:10px}
.route .rv{font-family:var(--mono);font-size:1.45rem;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.route .rv.s{font-size:1.05rem;color:var(--ink2)}
.tag{position:absolute;top:-9px;right:12px;background:var(--good);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.route.off{opacity:.55}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;font-size:.84rem;color:var(--ink2)}
.note b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.note .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.chip{display:inline-block;font-family:var(--mono);font-size:.78rem;padding:2px 8px;border-radius:999px;font-weight:500}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
summary{list-style:none;padding:14px 16px;font-size:.88rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:50px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:1.3rem;color:var(--ink3);font-weight:400}
details[open] summary::after{content:'–'}
.steps{padding:0 16px 14px}
.steps h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:10px 0 4px}
.step{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--ink2)}
.step:last-child{border:0}
.step b{font-family:var(--mono);font-weight:500;color:var(--ink);text-align:right;white-space:nowrap}
.step.fee b{color:var(--warn)}
.empty-state{text-align:center;color:var(--ink3);padding:34px 20px;font-size:.9rem}
.empty-state .big{font-size:2rem;margin-bottom:6px}
.missing{background:var(--warn-bg);border:1px dashed var(--warn-line);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:.85rem}
.missing button{font-weight:700;text-decoration:underline;color:inherit}


/* camino del dinero */
:root{--bn:#8a6500;--bn-bg:#fdf3d1;--bn-line:#ecd07a;--fb:#0a9e92;--fb-bg:#dff6f3;--fb-line:#9bdcd5;--zl:#6a2fd0;--zl-bg:#eee6fc;--zl-line:#c7b0f2}
@media (prefers-color-scheme:dark){:root{--bn:#f3c64d;--bn-bg:#33290a;--bn-line:#7a6119;--fb:#3fd6c8;--fb-bg:#0c3330;--fb-line:#1d6c65;--zl:#b79aff;--zl-bg:#271a4a;--zl-line:#4d3a8a}}
.path{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;position:relative}
.path.off{opacity:.6}
.path .pn{font-size:.72rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pair{display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;gap:6px}
.pc{border-radius:14px;padding:10px 9px;border:1.5px solid;min-width:0}
.pc.act{box-shadow:0 0 0 3px var(--ring);}
.pc.fb{--ring:var(--fb-line)}.pc.zl{--ring:var(--zl-line)}.pc.bn{--ring:var(--bn-line)}
.pc.bn{background:var(--bn-bg);border-color:var(--bn-line)}
.pc.bn .pk,.pc.bn .pv{color:var(--bn)}
.pair .pv{font-size:1.02rem;white-space:nowrap}
.pair .pv .u{display:block;font-size:.62rem;font-weight:600;letter-spacing:.04em;margin-top:-1px}
.recv.act{background:var(--good-bg);border-radius:12px;padding:11px 12px;margin:11px -2px 0}
.pc.fb{background:var(--fb-bg);border-color:var(--fb-line)}
.pc.zl{background:var(--zl-bg);border-color:var(--zl-line)}
.pk{font-size:.7rem;font-weight:600;line-height:1.25}
.pc.fb .pk{color:var(--fb)}.pc.zl .pk{color:var(--zl)}
.pv{font-family:var(--mono);font-size:1.3rem;font-weight:500;letter-spacing:-.03em;margin-top:3px}
.pc.fb .pv{color:var(--fb)}.pc.zl .pv{color:var(--zl)}
.pv.s{font-size:1.1rem;color:var(--ink)}
.arrow{color:var(--ink3);font-size:1.1rem}
.path .line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 2px 0;font-size:.82rem;color:var(--ink2)}
.path .line b{font-family:var(--mono);font-weight:500;color:var(--ink);white-space:nowrap}
.recv{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:.9rem;font-weight:600}
.recv b{font-family:var(--mono);font-size:1.45rem;font-weight:500;letter-spacing:-.03em;color:var(--good)}
.path.small{padding:14px}
.path.small .two{display:flex;justify-content:space-between;gap:12px}
.path.small .rt{text-align:right}
.path.small .pk{color:var(--ink3)}
.note .nt{font-weight:600;color:var(--ink);margin-bottom:4px;font-size:.84rem}

.path.eq .pn{margin-bottom:2px}
.eqrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.eqrow.bn{background:var(--bn-bg);border-color:var(--bn-line)}
.eqrow.bc{background:var(--accent-soft);border-color:var(--accent)}
.eqrow.bc{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.eq-k{font-size:.8rem;font-weight:700;color:var(--ink)}
.eq-r{font-family:var(--mono);font-size:.76rem;color:var(--ink3);margin-top:1px}
.eq-v{font-family:var(--mono);font-size:1.45rem;font-weight:500;letter-spacing:-.03em;color:var(--ink)}
.eqrow.bn .eq-v,.eqrow.bn .eq-k{color:var(--bn)}
.eqrow.bc .eq-v,.eqrow.bc .eq-k{color:var(--accent)}

/* sub-selector Bs / $ */
.sub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sub[hidden],.mini[hidden],.conv[hidden]{display:none}
.mini{display:inline-flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.mini button{padding:8px 13px;border-radius:9px;font-size:.78rem;font-weight:600;color:var(--ink2);min-height:36px}
.mini button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(14,35,64,.14)}
.conv{font-family:var(--mono);font-size:.88rem;font-weight:500;color:var(--accent);margin-top:2px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:20}
.bar-in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:15px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#07111f}}
.btn.ghost{flex:0 0 auto;padding:0 18px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.btn:active{transform:scale(.98)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet-in{max-width:480px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:1.1rem;letter-spacing:-.02em;margin-bottom:4px}
.sheet p.sub{font-size:.8rem;color:var(--ink3);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.in{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px}
.in label{display:block;font-size:.68rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.in input{width:100%;border:0;outline:0;background:none;font-family:var(--mono);font-size:1.15rem;color:var(--ink);padding:3px 0 1px}
.in input.txt{font-family:var(--sans);font-size:.85rem}
.in.full{grid-column:1/-1}
.in .h{font-size:.68rem;color:var(--ink3);margin-top:2px}
.sheet .btn{margin-top:14px;width:100%}
.info{font-size:.76rem;color:var(--ink3);margin-top:10px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.84rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  body{padding-top:20px}
  .sheet{left:50%;right:auto;width:480px;margin-left:-240px}
}
@media (max-width:360px){
  .field input{font-size:2.1rem}
  .vh{font-size:1.3rem}
  .route .rv{font-size:1.2rem}
}

/* ═════════ v3.1 · makeover: tablero arriba, trabajo abajo ═════════ */
:root{
  --sans:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --bg:#edf0f6; --line:#dde3ee;
  --hd:#0e1a38; --hd2:#16264f; --hd-ink:#f2f5fc; --hd-mute:#8d9bbd; --hd-link:#8fc1ff; --hd-amber:#f3c64d;
}
@media (prefers-color-scheme:dark){:root{--bg:#080f20;--line:#1d2c4a;--hd:#0b1530;--hd2:#12214a}}
body{background:var(--bg)}
body[data-a=cobro]{--cur:var(--fb);--cur-bg:var(--fb-bg)}
body[data-a=zinli]{--cur:var(--zl);--cur-bg:var(--zl-bg)}
body[data-a=usdt]{--cur:var(--bn);--cur-bg:var(--bn-bg)}
body[data-a=bs]{--cur:var(--good);--cur-bg:var(--good-bg)}

/* encabezado */
.hd{background:var(--hd);color:var(--hd-ink);border-radius:0 0 30px 30px;padding:0 16px 46px}
.hd-in{max-width:480px;margin:0 auto}
.top{padding:calc(16px + env(safe-area-inset-top)) 0 14px}
.title{font-size:1.6rem;font-weight:800;letter-spacing:-.045em;color:var(--hd-ink)}
.refresh{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--hd-ink)}
.refresh svg{color:var(--hd-link)}

.rates{gap:0;margin:0 -16px;padding:2px 16px 4px;scroll-padding-left:16px}
.rate{background:none;border:0;border-radius:0;padding:4px 14px 4px 0;margin-right:14px;min-width:0;border-right:1px solid rgba(255,255,255,.13)}
.rate:last-child{border-right:0;margin-right:0}
.rate .k{font-size:.74rem;font-weight:600;color:var(--hd-mute);text-transform:none;letter-spacing:0}
.rate .v{font-size:1.2rem;font-weight:500;letter-spacing:-.05em;color:var(--hd-ink);margin-top:2px}
.rate[data-open=bin] .v{color:var(--hd-amber)}
.rate.empty{background:none;border-style:solid;border-color:rgba(255,255,255,.13)}
.rate.empty .v{font-size:1.05rem;color:var(--hd-amber);opacity:.8;margin-top:8px}

.gap{display:inline-flex;gap:10px;align-items:baseline;background:rgba(255,255,255,.08);border-radius:999px;padding:7px 14px;margin:12px 0 0;font-size:.8rem;font-weight:500;color:var(--hd-mute)}
.gap b{color:var(--hd-link);font-size:.9rem}
.stamp{margin:12px 0 0;font-size:.76rem;color:var(--hd-mute);align-items:center}
.stamp button{color:var(--hd-link);font-size:.8rem;font-weight:600;padding:8px 0}

/* zona de trabajo */
.app{padding-top:0}
.seg{margin-top:-30px;position:relative;z-index:2;background:var(--card);border-radius:22px;padding:5px;gap:4px;box-shadow:0 16px 32px -16px rgba(8,18,46,.55),0 0 0 1px rgba(14,26,58,.05)}
.seg button{border-radius:17px;color:var(--ink2);font-weight:700;transition:background .15s,color .15s}
.seg button small{color:var(--ink3);font-weight:500}
.seg button.on{background:var(--cur-bg);color:var(--cur);box-shadow:none}
.seg button.on small{color:var(--cur);opacity:.75}
.amount{border-radius:24px;border:0;margin-top:12px;box-shadow:0 14px 30px -20px rgba(14,26,58,.4),0 0 0 1px rgba(14,26,58,.05)}
.field .u{color:var(--cur)}
.field input{caret-color:var(--cur)}
.amount label{font-weight:600;font-size:.82rem}

/* etiquetas en minúscula: la estructura la da el color, no las mayúsculas */
.path{border-radius:24px;border:0;box-shadow:0 12px 28px -20px rgba(14,26,58,.38),0 0 0 1px rgba(14,26,58,.05)}
.path .pn{font-size:.9rem;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:-.01em}
.path.small{border-radius:20px;box-shadow:0 0 0 1px rgba(14,26,58,.06)}
.path.small .pn{color:var(--ink2);font-size:.82rem}

.btn{border-radius:18px;font-weight:800}

<body>
<header class="hd"><div class="hd-in">
  <div class="top">
    <div class="title">Tasas</div>
    <button class="refresh" id="refresh" aria-label="Actualizar tasas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      Actualizar
    </button>
  </div>

  <div class="rates" id="rates"></div>
  <div class="gap" id="gap" hidden></div>
  <div class="stamp"><span id="stamp">Sin actualizar</span><button id="editRates">Editar tasas</button></div>
</div></header>

<div class="app">

  <div class="seg" id="seg" role="tablist">
    <button data-a="cobro" class="on">Facebank<small>cobro</small></button>
    <button data-a="zinli">Zinli<small>recarga</small></button>
    <button data-a="usdt">Binance<small>USDT</small></button>
    <button data-a="bs">Bolívares<small>Bs</small></button>
  </div>

  <div class="amount">
    <div class="sub" id="sub" hidden>
      <div class="mini" id="bsMode"><button data-m="bs">Bolívares</button><button data-m="usd">Dólares</button></div>
      <div class="mini" id="refRate" hidden><button data-r="bcv">BCV</button><button data-r="eur">Euro</button><button data-r="bin">Binance</button><button data-r="otra" id="refOtra">Otra</button></div>
    </div>
    <label id="amountLabel">¿Cuántos bolívares necesitas?</label>
    <div class="field">
      <span class="u" id="unit">Bs</span>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-labelledby="amountLabel">
      <button class="clear" id="clear" aria-label="Borrar">✕</button>
    </div>
    <div class="conv" id="conv" hidden></div>
    <div class="quick" id="quick"></div>
  </div>

  <div class="res" id="res"></div>
</div>

<div class="bar"><div class="bar-in">
  <button class="btn ghost" id="reset" aria-label="Limpiar monto">Limpiar</button>
  <button class="btn primary" id="copy">Copiar resumen</button>
</div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Tasas">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3>Tasas</h3>
    <p class="sub">Se llenan solas con “Actualizar”. Puedes corregir cualquiera a mano.</p>
    <div class="grid2">
      <div class="in"><label>BCV dólar (Bs)</label><input id="s-bcv" inputmode="decimal" placeholder="0,00"></div>
      <div class="in"><label>BCV euro (Bs)</label><input id="s-eur" inputmode="decimal" placeholder="0,00"></div>
      <div class="in"><label>Binance vendes (Bs/USDT)</label><input id="s-bin" inputmode="decimal" placeholder="0,00"></div>
      <div class="in"><label>USDT te cuesta (USD)</label><input id="s-usdt" inputmode="decimal" placeholder="1,02"><div class="h">Lo que pagas por 1 USDT</div></div>
      <div class="in"><label>Otra tasa (Bs)</label><input id="s-otra" inputmode="decimal" placeholder="0,00"><div class="h">Opcional · vacía no se muestra</div></div>
      <div class="in full"><label>URL del Worker</label><input class="txt" id="s-url" type="url" inputmode="url" placeholder="https://tasas.tu-cuenta.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </div>
    <div class="info" id="s-info"></div>
    <button class="btn primary" id="s-done">Listo</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ════════════ CONFIG ════════════
// Pega aquí la URL de tu Worker (o ponla desde "Editar tasas" en la app).
const WORKER_URL = 'https://monitortasas.weareburgo.workers.dev';
const ZF = 1.0666;            // Facebank cobra base × 1.0666 (Zinli 6.66%)
const ZP = 0.0666;
const KEY = 'tasas_v3';

// ════════════ ESTADO ════════════
const S = Object.assign({anchor:'cobro',bsMode:'bs',refRate:'bcv',otra:'',amount:'',bcv:'',eur:'',bin:'',binBuy:'',usdt:'',worker:'',ts:null,src:null}, load());
if(!['cobro','zinli','usdt','bs'].includes(S.anchor)){S.anchor='cobro';S.amount=''}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)&&n>0?n:null};
const f=(v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>'$'+f(v);
const bs=v=>'Bs '+f(v);
const pct=(v,d=1)=>(v>=0?'+':'')+f(v*100,d)+'%';

const REF={bcv:'BCV',eur:'euro',bin:'Binance',otra:'Otra'};
const refVal=()=>num(S[S.refRate]);
const ANCHORS={
  cobro:{label:'¿Cuánto te cobran en Facebank?',unit:'$',quick:[50,100,200,500,1000]},
  zinli:{label:'¿Cuánto recargas en Zinli?',unit:'$',quick:[50,100,200,500,1000]},
  usdt:{label:'¿Cuántos USDT tienes?',unit:'USDT',quick:[50,100,200,500,1000]},
  bs:{label:'¿Cuántos bolívares necesitas?',unit:'Bs',quick:[1000,2500,5000,10000,20000]},
};

// ════════════ CÁLCULO ════════════
// Todo se reduce a un destino en Bs. Luego se compara cuánto cobra Facebank por cada ruta.
function calc(){
  const a=num(S.amount), bcv=num(S.bcv), bin=num(S.bin), up=num(S.usdt);
  const out={a,bcv,bin,up,missing:[]};
  const needA = S.anchor!=='bs' ? ['bin','usdt'] : [];
  if(!a) return out;
  // Ruta A necesita Binance y precio USDT; Ruta B necesita BCV
  const canA = !!(bin&&up), canB = !!bcv;
  if(!canA){ if(!bin)out.missing.push('Binance'); if(!up)out.missing.push('precio USDT'); }
  if(!canB) out.missing.push('BCV');

  let target=null, base=null;
  if(S.anchor==='bs'){
    target=a;
    if(S.bsMode==='usd'){
      const rr=refVal();
      if(rr) target=a*rr; else {target=null; out.missing.push('tasa '+REF[S.refRate]);}
    }
    if(canA&&target) base=target*up/bin;
  }
  else if(canA){
    // Facebank: el cobro incluye Zinli → base = cobro/1.0666 · USDT: base = USDT × precio
    base = S.anchor==='usdt' ? a*up : S.anchor==='zinli' ? a : a/ZF;
    target = base/up*bin;
  }
  out.target=target;
  if(canA && base){
    out.A={base, zu:base*ZP, cobro:base*ZF, usdt:base/up, bs:base/up*bin};
  }
  if(canB && target){
    out.B={cobro:target/bcv, bs:target};
  }
  if(out.A&&out.B){
    out.ahorro=out.B.cobro-out.A.cobro;
    out.ahorroPct=out.ahorro/out.B.cobro;
    out.binMin=bcv*up*ZF;          // Binance mínimo para que Zinli+USDT iguale a la tarjeta
    out.margen=(bin-out.binMin)/out.binMin;
  }
  return out;
}

// ════════════ RENDER ════════════
function rateCard(k,v,key,fmt){
  const empty = !v;
  return `<button class="rate ${empty?'empty':''}" data-open="${key}"><div class="k">${k}</div><div class="v">${empty?'Poner':fmt(v)}</div></button>`;
}
function renderRates(){
  const bcv=num(S.bcv),eur=num(S.eur),bin=num(S.bin),up=num(S.usdt);
  let h='';
  h+=rateCard('BCV $',bcv,'bcv',v=>f(v,2));
  h+=rateCard('BCV €',eur,'eur',v=>f(v,2));
  h+=rateCard('Binance',bin,'bin',v=>f(v,2));
  h+=rateCard('USDT $',up,'usdt',v=>'$'+f(v,3));
  if(num(S.otra)) h+=rateCard('Otra',num(S.otra),'otra',v=>f(v,2));
  $('rates').innerHTML=h;
  const g=$('gap');
  if(bcv&&bin){g.hidden=false;g.innerHTML=`<span>Brecha Binance vs BCV</span><b>${pct(bin/bcv-1)}</b>`}else g.hidden=true;
}
function renderStamp(){
  if(!S.ts){$('stamp').textContent='Sin actualizar · toca Actualizar';return}
  const m=Math.round((Date.now()-new Date(S.ts))/60000);
  const t=m<1?'ahora mismo':m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`;
  $('stamp').textContent='Actualizado '+t;
}

function renderResult(){
  const r=calc(), el=$('res');
  renderConv(r);
  if(!r.a){
    el.innerHTML=`<div class="empty-state"><div class="big">🧮</div>Escribe un monto arriba y te muestro<br>qué ruta te conviene más.</div>`;
    return;
  }
  let h='';
  if(r.missing.length){
    h+=`<div class="missing">Falta: <b>${r.missing.join(', ')}</b>. <button data-open="all">Completar tasas</button></div>`;
  }
  const A=r.A,B=r.B;

  // Veredicto
  if(A&&B){
    let cls,head,sub;
    const p=r.ahorroPct;
    if(Math.abs(r.ahorro)<0.005){cls='neutral';head='Da igual';sub='Las dos rutas cuestan lo mismo.'}
    else if(r.ahorro>0){
      cls = p>=0.03?'good':'warn';
      head = p>=0.03?'Conviene Zinli + Binance':'Zinli + Binance, por poco';
      sub = `Ahorras <b>${usd(r.ahorro)}</b> (${f(p*100,1)}%) frente a pagar con tarjeta.`;
    } else {
      cls='bad';head='Conviene la tarjeta';
      sub=`Zinli + Binance te cuesta <b>${usd(-r.ahorro)}</b> más (${f(-p*100,1)}%).`;
    }
    h+=`<div class="verdict slim ${cls}"><div class="vs">${sub}</div></div>`;
  }

  const winA=A&&B&&r.ahorro>0.005, winB=A&&B&&r.ahorro<-0.005;

  // Ruta Zinli + Binance, en el orden del camino del dinero
  if(A){
    h+=`<div class="path ${winB?'off':''}">${winA?'<span class="tag">Mejor</span>':''}
      <div class="pn">Zinli + Binance</div>
      <div class="pair">
        <div class="pc fb ${S.anchor==='cobro'?'act':''}"><div class="pk">Cobro Facebank</div><div class="pv">${usd(A.cobro)}</div></div>
        <div class="pc zl ${S.anchor==='zinli'?'act':''}"><div class="pk">Recarga Zinli</div><div class="pv">${usd(A.base)}</div></div>
        <div class="pc bn ${S.anchor==='usdt'?'act':''}"><div class="pk">Recibes Binance</div><div class="pv">${f(A.usdt,2)}<span class="u">USDT</span></div></div>
      </div>
      <div class="line"><span>Comisión Zinli (6,66%)</span><b>${usd(A.zu)}</b></div>
      <div class="line"><span>Precio al comprar USDT</span><b>$${f(r.up,3)}</b></div>
      <div class="recv ${S.anchor==='bs'?'act':''}"><span>Recibes</span><b>${bs(A.bs)}</b></div>
    </div>`;
  }

  // Tarjeta directa (más pequeña)
  if(B){
    h+=`<div class="path small ${winA?'off':''}">${winB?'<span class="tag">Mejor</span>':''}
      <div class="pn">Tarjeta directa (BCV)</div>
      <div class="two">
        <div><div class="pk">Facebank te cobra</div><div class="pv s">${usd(B.cobro)}</div></div>
        <div class="rt"><div class="pk">Recibes</div><div class="pv s">${bs(B.bs)}</div></div>
      </div>
    </div>`;
  }

  // Esos bolívares, valorados según cada tasa
  if(r.target){
    const eur=num(S.eur), t=r.target, rows=[];
    if(r.bin) rows.push(['bn','Tasa Binance',f(r.bin),usd(t/r.bin)]);
    if(r.bcv) rows.push(['bc','Tasa BCV',f(r.bcv),usd(t/r.bcv)]);
    if(eur)   rows.push(['eu','Tasa euro',f(eur),usd(t/eur)]);
    const ot=num(S.otra); if(ot) rows.push(['ot','Otra',f(ot),usd(t/ot)]);
    if(rows.length){
      h+=`<div class="path eq"><div class="pn">${bs(t)} equivalen a</div>`+
         rows.map(x=>`<div class="eqrow ${x[0]}"><div><div class="eq-k">${x[1]}</div><div class="eq-r">Bs ${x[2]}</div></div><div class="eq-v">${x[3]}</div></div>`).join('')+`</div>`;
    }
  }

  // Punto de equilibrio
  if(r.binMin){
    const c = r.margen>=0.03?'good':r.margen>=0?'warn':'bad';
    h+=`<div class="note">
      <div class="row"><span>Binance mínimo para que valga la pena</span><b>Bs ${f(r.binMin)}</b></div>
      <div class="row"><span>Hoy está en</span><b>Bs ${f(r.bin)} <span class="chip ${c}">${pct(r.margen)}</span></b></div>
    </div>`;
  }

  // Paso a paso
  if(A||B){
    h+=`<details><summary>Ver paso a paso</summary><div class="steps">`;
    if(A){
      h+=`<h4>Zinli + Binance</h4>
      <div class="step"><span>Facebank te cobra</span><b>${usd(A.cobro)}</b></div>
      <div class="step fee"><span>Comisión Zinli (6,66%)</span><b>− ${usd(A.zu)}</b></div>
      <div class="step"><span>Recarga en Zinli</span><b>${usd(A.base)}</b></div>
      <div class="step"><span>Compras USDT a $${f(r.up,3)}</span><b>${f(A.usdt,2)} USDT</b></div>
      <div class="step"><span>Vendes a Bs ${f(r.bin)}</span><b>${bs(A.bs)}</b></div>`;
    }
    if(B){
      h+=`<h4>Tarjeta directa</h4>
      <div class="step"><span>Facebank te cobra</span><b>${usd(B.cobro)}</b></div>
      <div class="step"><span>Sin Zinli, sin USDT</span><b>$0,00 extra</b></div>
      <div class="step"><span>Tasa BCV</span><b>${f(r.bcv)}</b></div>
      <div class="step"><span>Recibes</span><b>${bs(B.bs)}</b></div>`;
    }
    h+=`</div></details>`;
  }
  el.innerHTML=h;
}

function renderAnchor(){
  document.body.dataset.a=S.anchor;
  if(S.refRate==='otra'&&!num(S.otra)){S.refRate='bcv';save();}
  $('refOtra').hidden=!num(S.otra);
  const A=ANCHORS[S.anchor];
  const usdMode=S.anchor==='bs'&&S.bsMode==='usd';
  $('sub').hidden=S.anchor!=='bs';
  $('refRate').hidden=!usdMode;
  document.querySelectorAll('#bsMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.bsMode));
  document.querySelectorAll('#refRate button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.refRate));
  $('amountLabel').textContent=usdMode?`¿Cuántos dólares necesitas? (a tasa ${REF[S.refRate]})`:A.label;
  $('unit').textContent=usdMode?'$':A.unit;
  const quick=usdMode?[10,20,50,100,200]:A.quick;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.a===S.anchor));
  $('quick').innerHTML=quick.map(n=>`<button data-q="${n}">${n.toLocaleString('es-VE')}</button>`).join('');
  $('clear').classList.toggle('show',!!S.amount);
}
function renderConv(r){
  const el=$('conv');
  if(S.anchor==='bs'&&S.bsMode==='usd'&&r.a&&r.target){
    el.hidden=false;el.textContent=`= ${bs(r.target)} a tasa ${REF[S.refRate]} (${f(refVal())})`;
  } else el.hidden=true;
}
function renderAll(){renderRates();renderStamp();renderAnchor();renderResult()}

// ════════════ EVENTOS ════════════
$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.anchor=b.dataset.a;S.amount='';$('amount').value='';save();renderAll();
});
$('bsMode').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.m===S.bsMode)return;
  S.bsMode=b.dataset.m;S.amount='';$('amount').value='';save();renderAll();
});
$('refRate').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.refRate=b.dataset.r;save();renderAll();
});
$('amount').addEventListener('input',e=>{
  S.amount=e.target.value.replace(/[^\d.,]/g,'');
  if(S.amount!==e.target.value)e.target.value=S.amount;
  $('clear').classList.toggle('show',!!S.amount);save();renderResult();
});
$('clear').addEventListener('click',()=>{S.amount='';$('amount').value='';$('clear').classList.remove('show');save();renderResult();$('amount').focus()});
$('reset').addEventListener('click',()=>{S.amount='';$('amount').value='';save();renderAnchor();renderResult();window.scrollTo({top:0,behavior:'smooth'})});
$('quick').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.amount=b.dataset.q;$('amount').value=S.amount;save();renderAnchor();renderResult();
});
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o)openSheet(o.dataset.open);
});
$('editRates').addEventListener('click',()=>openSheet('all'));

// Hoja de tasas
const FIELDS={'s-bcv':'bcv','s-eur':'eur','s-bin':'bin','s-usdt':'usdt','s-otra':'otra'};
function openSheet(focus){
  Object.entries(FIELDS).forEach(([id,k])=>{$(id).value=S[k]===''||S[k]==null?'':String(S[k]).replace('.',',')});
  $('s-url').value=S.worker||WORKER_URL||'';
  info();
  $('sheet').classList.add('on');$('scrim').classList.add('on');
  const map={bcv:'s-bcv',eur:'s-eur',bin:'s-bin',usdt:'s-usdt',otra:'s-otra'};
  if(map[focus])setTimeout(()=>$(map[focus]).focus(),280);
}
function closeSheet(){
  $('sheet').classList.remove('on');$('scrim').classList.remove('on');
  document.activeElement&&document.activeElement.blur();
}
function info(){
  const bb=num(S.binBuy);
  $('s-info').innerHTML = bb ? `Referencia: comprar USDT en Binance está en Bs ${f(bb)}.` : '';
}
Object.entries(FIELDS).forEach(([id,k])=>{
  $(id).addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/[^\d.,]/g,'');
    S[k]=e.target.value;save();renderRates();renderAnchor();renderResult();
  });
});
$('s-url').addEventListener('input',e=>{S.worker=e.target.value.trim();save()});
$('s-done').addEventListener('click',closeSheet);
$('scrim').addEventListener('click',closeSheet);


// Binance P2P directo desde el navegador (respaldo si el Worker recibe 403)
async function binanceDirecto(){
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search',{
      method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fiat:'VES',asset:'USDT',tradeType:'SELL',page:1,rows:15,payTypes:[],countries:[],publisherType:null,proMerchantAds:false,shieldMerchantAds:false})
    });
    clearTimeout(t);
    if(!r.ok)return null;
    const j=await r.json();
    const p=(j.data||[]).map(a=>parseFloat(a.adv&&a.adv.price)).filter(x=>x>0).slice(0,8).sort((a,b)=>a-b);
    if(!p.length)return null;
    const m=Math.floor(p.length/2);
    return p.length%2?p[m]:(p[m-1]+p[m])/2;
  }catch(e){return null}
}
// Actualizar con el Worker
async function refresh(silent){
  const url=(S.worker||WORKER_URL||'').trim();
  if(!url){ if(!silent){toast('Falta la URL del Worker');openSheet('all');setTimeout(()=>$('s-url').focus(),300)} return }
  const btn=$('refresh');btn.classList.add('spin');
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(url,{signal:ctl.signal});clearTimeout(t);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    let got=0; const falta=[];
    const set=(k,v,d)=>{if(v>0){S[k]=String(Math.round(v*10**d)/10**d).replace('.',',');got++;return true}return false};
    if(!set('bcv',j.bcv_usd,4))falta.push('BCV $');
    if(!set('eur',j.bcv_eur,4))falta.push('BCV €');
    if(j.binance_compra>0)S.binBuy=String(j.binance_compra);
    let viaNavegador=false;
    if(!set('bin',j.binance_venta,2)){
      // El Worker no pudo con Binance (suele bloquear servidores): se intenta desde este navegador
      const v=await binanceDirecto();
      if(v&&set('bin',v,2))viaNavegador=true; else falta.push('Binance');
    }
    if(got){S.ts=j.updated||new Date().toISOString();save();renderAll();
      toast(falta.length?`Actualizado. Falta ${falta.join(', ')}: ponla a mano`:viaNavegador?'Tasas actualizadas (Binance desde tu navegador) ✓':'Tasas actualizadas ✓')}
    else throw new Error('sin datos');
  }catch(e){
    toast('No pude traer las tasas. Pon las tuyas a mano.');
  }finally{btn.classList.remove('spin')}
}
$('refresh').addEventListener('click',()=>refresh(false));

// Copiar resumen
$('copy').addEventListener('click',async()=>{
  const r=calc();
  if(!r.a||(!r.A&&!r.B)){toast('Escribe un monto y completa las tasas');return}
  const L=[`Tasas · ${new Date().toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'})}`,`Destino: ${bs(r.target)}`];
  if(r.A)L.push(`Zinli + Binance: Facebank cobra ${usd(r.A.cobro)} (base ${usd(r.A.base)} + Zinli ${usd(r.A.zu)}) → ${f(r.A.usdt,2)} USDT → ${bs(r.A.bs)}`);
  if(r.B)L.push(`Tarjeta BCV: Facebank cobra ${usd(r.B.cobro)}`);
  if(r.A&&r.B)L.push(r.ahorro>0?`Conviene Zinli + Binance: ahorras ${usd(r.ahorro)} (${f(r.ahorroPct*100,1)}%)`:r.ahorro<0?`Conviene tarjeta: ahorras ${usd(-r.ahorro)}`:'Mismo costo');
  L.push(`BCV ${f(r.bcv)} · Binance ${f(r.bin)} · USDT $${f(r.up,3)}`+(num(S.otra)?` · Otra ${f(num(S.otra))}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt)}catch(e){
    const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove();
  }
  toast('Resumen copiado ✓');
});

let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

// ════════════ INICIO ════════════
$('amount').value=S.amount||'';
renderAll();
setInterval(renderStamp,30000);
// Auto-actualiza al abrir si hay Worker y las tasas tienen más de 10 min
if((S.worker||WORKER_URL)&&(!S.ts||Date.now()-new Date(S.ts)>10*60000))refresh(true);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&(S.worker||WORKER_URL)&&(!S.ts||Date.now()-new Date(S.ts)>10*60000))refresh(true);
});
</script>
